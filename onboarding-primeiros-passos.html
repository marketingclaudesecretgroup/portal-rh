<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seus primeiros passos</title>
  <style>
    :root {
      --background: #ffffff;
      --card-background: #ffffff;
      --text: #171717;
      --muted: #5f5f5f;
      --accent: #b7863f;
      --border: #e4e1dc;
      --shadow: 0 10px 28px rgba(23, 23, 23, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "Google Sans", Arial, sans-serif;
    }

    .steps {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
    }

    .steps__grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .step-card {
      min-height: 260px;
      padding: 28px 24px 26px;
      background: var(--card-background);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      transition: transform 180ms ease, box-shadow 180ms ease,
        border-color 180ms ease;
    }

    .step-card:hover {
      transform: translateY(-4px);
      border-color: rgba(183, 134, 63, 0.55);
      box-shadow: 0 16px 36px rgba(23, 23, 23, 0.1);
    }

    .step-card__number {
      margin: 0 0 25px;
      color: var(--accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
    }

    .step-card__icon {
      display: block;
      width: 44px;
      height: 44px;
      margin-bottom: 22px;
      color: var(--text);
    }

    .step-card__icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .step-card__title {
      margin: 0 0 12px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .step-card__description {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    @media (max-width: 820px) {
      .steps__grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .steps {
        padding: 12px;
        overflow: hidden;
      }

      .steps__grid {
        grid-template-columns: none;
        grid-auto-columns: minmax(250px, 82vw);
        grid-auto-flow: column;
        gap: 14px;
        overflow-x: auto;
        padding: 2px 2px 14px;
        scroll-snap-type: x mandatory;
        scrollbar-width: thin;
      }

      .step-card {
        min-height: 260px;
        padding: 24px;
        scroll-snap-align: start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .step-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <section class="steps" aria-label="Seus primeiros passos">
    <div class="steps__grid">
      <article class="step-card">
        <p class="step-card__number">01 ·</p>
        <span class="step-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M8 42h32M12 42V15l10-7 10 7v27M32 23h7v19M18 18h2M24 18h2M18 25h2M24 25h2M18 32h2M24 32h2M20 42v-5h4v5"/>
          </svg>
        </span>
        <h3 class="step-card__title">Conheça a Secret</h3>
        <p class="step-card__description">Nossa história, cultura e marcas.</p>
      </article>

      <article class="step-card">
        <p class="step-card__number">02 ·</p>
        <span class="step-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <rect x="9" y="19" width="30" height="23" rx="3"/>
            <path d="M15 19v-5a9 9 0 0 1 18 0v5M24 28v6M21 31h6"/>
          </svg>
        </span>
        <h3 class="step-card__title">Prepare seus acessos</h3>
        <p class="step-card__description">Ferramentas e canais essenciais.</p>
      </article>

      <article class="step-card">
        <p class="step-card__number">03 ·</p>
        <span class="step-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="m4 18 20-10 20 10-20 10L4 18Z"/>
            <path d="M12 22v10c7 6 17 6 24 0V22M42 20v12"/>
          </svg>
        </span>
        <h3 class="step-card__title">Complete os treinamentos</h3>
        <p class="step-card__description">Conteúdos para sua integração.</p>
      </article>

      <article class="step-card">
        <p class="step-card__number">04 ·</p>
        <span class="step-card__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="15" r="6"/>
            <circle cx="10" cy="19" r="4"/>
            <circle cx="38" cy="19" r="4"/>
            <path d="M13 39v-5c0-6 5-10 11-10s11 4 11 10v5M3 39v-4c0-5 3-8 8-8 2 0 4 1 5 2M45 39v-4c0-5-3-8-8-8-2 0-4 1-5 2"/>
          </svg>
        </span>
        <h3 class="step-card__title">Conecte-se com o time</h3>
        <p class="step-card__description">Pessoas que vão apoiar sua jornada.</p>
      </article>
    </div>
  </section>
</body>
</html>
