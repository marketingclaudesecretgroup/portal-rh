<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso rápido</title>
  <style>
    :root {
      --background: #ffffff;
      --card: #ffffff;
      --text: #171717;
      --muted: #66635f;
      --accent: #b7863f;
      --border: #e4e1dc;
      --hover: #f5f4f1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "Google Sans", Arial, sans-serif;
    }

    .quick-access {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px;
    }

    .quick-access__title {
      margin: 0 0 20px;
      font-size: clamp(25px, 3vw, 36px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .quick-access__title strong {
      font-weight: 750;
    }

    .quick-access__grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-link {
      display: flex;
      min-width: 0;
      min-height: 132px;
      padding: 19px 12px 16px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-align: center;
      text-decoration: none;
      transition: background-color 160ms ease, border-color 160ms ease,
        color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .quick-link:hover,
    .quick-link:focus-visible {
      border-color: rgba(183, 134, 63, 0.65);
      background: var(--hover);
      color: var(--accent);
      outline: none;
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(23, 23, 23, 0.08);
    }

    .quick-link__icon {
      display: block;
      width: 46px;
      height: 46px;
      color: currentColor;
    }

    .quick-link__icon svg {
      display: block;
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .quick-link__label {
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.25;
    }

    @media (max-width: 920px) {
      .quick-access__grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .quick-access {
        padding: 8px 10px 12px;
      }

      .quick-access__title {
        margin-bottom: 14px;
        font-size: 27px;
      }

      .quick-access__grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .quick-link {
        min-height: 94px;
        padding: 12px 5px 10px;
        gap: 8px;
        border-radius: 8px;
      }

      .quick-link__icon {
        width: 34px;
        height: 34px;
      }

      .quick-link__label {
        font-size: 11px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .quick-link:hover,
      .quick-link:focus-visible {
        transform: none;
      }
    }

    @media (max-width: 350px) {
      .quick-access__grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .quick-link {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <section class="quick-access" aria-labelledby="quick-access-title">
    <nav class="quick-access__grid" aria-label="Atalhos do portal">
      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/onboarding" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <circle cx="24" cy="15" r="8"/>
            <path d="M9 42v-4c0-8 6-13 15-13s15 5 15 13v4"/>
          </svg>
        </span>
        <span class="quick-link__label">Onboarding</span>
      </a>

      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/desenvolvimento/treinamentos" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="m4 18 20-10 20 10-20 10L4 18Z"/>
            <path d="M12 22v10c7 6 17 6 24 0V22M42 20v12"/>
          </svg>
        </span>
        <span class="quick-link__label">Treinamentos</span>
      </a>

      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/gente-e-gestao/beneficios" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 41S7 31 7 18c0-6 4-10 10-10 4 0 6 2 7 5 1-3 3-5 7-5 6 0 10 4 10 10 0 13-17 23-17 23Z"/>
          </svg>
        </span>
        <span class="quick-link__label">Benefícios</span>
      </a>

      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/calendario" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <rect x="6" y="9" width="36" height="33" rx="4"/>
            <path d="M15 5v8M33 5v8M6 18h36M14 25h4M23 25h4M32 25h4M14 33h4M23 33h4M32 33h4"/>
          </svg>
        </span>
        <span class="quick-link__label">Calendário 2026</span>
      </a>

      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/desenvolvimento/nr1-saiba-mais" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M24 5 40 11v11c0 10-6 17-16 21C14 39 8 32 8 22V11l16-6Z"/>
            <path d="m16 24 5 5 11-12"/>
          </svg>
        </span>
        <span class="quick-link__label">NR1</span>
      </a>

      <a class="quick-link" href="https://sites.google.com/secretoutlet.com.br/comunicasecret/gente-e-gestao/politicas" target="_blank" rel="noopener noreferrer">
        <span class="quick-link__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M11 5h19l8 8v30H11V5Z"/>
            <path d="M30 5v9h8M17 23h15M17 30h15M17 37h10"/>
          </svg>
        </span>
        <span class="quick-link__label">Políticas</span>
      </a>
    </nav>
  </section>
</body>
</html>
