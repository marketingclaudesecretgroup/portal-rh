<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Como Gente &amp; Gestão pode ajudar</title>
  <style>
    :root {
      --background: #ffffff;
      --card: #ffffff;
      --text: #171717;
      --muted: #66635f;
      --gold: #b7863f;
      --icon: #77705e;
      --border: #e4e1dc;
      --shadow: 0 8px 24px rgba(23, 23, 23, .055);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--background);
      color: var(--text);
      font-family: Inter, "Google Sans", Arial, sans-serif;
    }

    .support-grid {
      display: grid;
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 16px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .support-card {
      display: flex;
      min-width: 0;
      min-height: 220px;
      padding: 28px 20px 25px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
      transition: border-color 160ms ease, box-shadow 160ms ease,
        transform 160ms ease;
    }

    .support-card:hover {
      border-color: rgba(183, 134, 63, .6);
      box-shadow: 0 14px 30px rgba(23, 23, 23, .09);
      transform: translateY(-3px);
    }

    .support-card__icon {
      display: grid;
      width: 53px;
      height: 53px;
      margin-bottom: 22px;
      color: var(--icon);
      place-items: center;
      transition: color 160ms ease, transform 160ms ease;
    }

    .support-card:hover .support-card__icon {
      color: var(--gold);
      transform: translateY(-2px);
    }

    .support-card__icon svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .support-card__title {
      margin: 0 0 11px;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.3;
    }

    .support-card__description {
      max-width: 210px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 850px) {
      .support-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      .support-grid {
        padding: 10px;
        gap: 9px;
      }

      .support-card {
        min-height: 176px;
        padding: 20px 10px 18px;
      }

      .support-card__icon {
        width: 39px;
        height: 39px;
        margin-bottom: 14px;
      }

      .support-card__title {
        margin-bottom: 8px;
        font-size: 13px;
      }

      .support-card__description {
        font-size: 11px;
        line-height: 1.4;
      }
    }

    @media (max-width: 330px) {
      .support-grid { grid-template-columns: 1fr; }
      .support-card { min-height: 160px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .support-card,
      .support-card__icon { transition: none; }
    }
  </style>
</head>
<body>
  <section class="support-grid" aria-label="Como Gente e Gestão pode ajudar">
    <article class="support-card">
      <span class="support-card__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <circle cx="18" cy="15" r="6"/>
          <circle cx="33" cy="18" r="5"/>
          <path d="M5 41v-5c0-7 5-11 13-11s13 4 13 11v5M29 27c2-2 4-3 7-3 6 0 9 4 9 10v7H31"/>
        </svg>
      </span>
      <h3 class="support-card__title">Benefícios e elegibilidade</h3>
      <p class="support-card__description">Orientações sobre acesso, regras e utilização.</p>
    </article>

    <article class="support-card">
      <span class="support-card__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M11 5h19l8 8v30H11V5Z"/>
          <path d="M30 5v9h8M17 23h15M17 30h15M17 37h10"/>
        </svg>
      </span>
      <h3 class="support-card__title">Documentos e políticas</h3>
      <p class="support-card__description">Apoio para consultar diretrizes e processos.</p>
    </article>

    <article class="support-card">
      <span class="support-card__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M6 38 18 26l8 7L42 12"/>
          <path d="M31 12h11v11"/>
        </svg>
      </span>
      <h3 class="support-card__title">Jornada do colaborador</h3>
      <p class="support-card__description">Informações sobre integração e desenvolvimento.</p>
    </article>

    <article class="support-card">
      <span class="support-card__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M5 8h27v21H18L10 36v-7H5V8Z"/>
          <path d="M35 17h8v20h-5v6l-7-6h-7v-5"/>
        </svg>
      </span>
      <h3 class="support-card__title">Dúvidas e acolhimento</h3>
      <p class="support-card__description">Um canal para ouvir, orientar e encaminhar.</p>
    </article>
  </section>
</body>
</html>
